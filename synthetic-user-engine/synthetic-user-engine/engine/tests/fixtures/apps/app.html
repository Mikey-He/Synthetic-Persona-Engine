<!doctype html><html><head><meta charset='utf-8'><title>Dashboard</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>Dashboard</h1><button id='go'>Start the review</button><script>const save=(k,v)=>localStorage.setItem(k,v);if(!localStorage.getItem('signedin'))location.href='login.html';go.onclick=()=>{save('reviewed','yes');location.href='result.html'};</script></body></html>
