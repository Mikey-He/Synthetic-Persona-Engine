<!doctype html><html><head><meta charset='utf-8'><title>Prototype</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>Prototype</h1><canvas id='c' width='900' height='420' style='border:1px solid #ccc'></canvas><script>const save=(k,v)=>localStorage.setItem(k,v);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,900,420);x.fillStyle='#202124';x.font='28px Arial';x.fillText('Choose a plan',40,60);x.font='22px Arial';x.fillText('Starter',60,160);x.fillText('Business',360,160);x.fillStyle='#1a73e8';x.fillRect(340,300,220,56);x.fillStyle='#fff';x.font='22px Arial';x.fillText('Continue',398,336);c.onclick=e=>{const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(px>340&&px<560&&py>300&&py<356){save('continued','yes');location.href='result.html'}};</script></body></html>
