<!doctype html><html><head><meta charset='utf-8'><title>Export</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>Export</h1><button id='x'>Export as CSV</button><script>const save=(k,v)=>localStorage.setItem(k,v);x.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['name,amount\nAtlas,1000\n'],{type:'text/csv'}));a.download='report.csv';document.body.appendChild(a);a.click();};</script></body></html>
