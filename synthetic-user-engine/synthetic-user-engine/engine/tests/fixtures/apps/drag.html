<!doctype html><html><head><meta charset='utf-8'><title>Board</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>Board</h1><div style='display:flex;gap:40px'><div id='todo' style='width:220px;min-height:200px;border:1px solid #ccc;padding:8px'><b>To do</b><div id='card' role='button' tabindex='0' style='padding:8px;margin-top:8px;background:#e8f0fe;cursor:grab'>Write the summary</div></div><div id='done' role='button' tabindex='0' style='width:220px;min-height:200px;border:1px solid #ccc;padding:8px'>Done column</div></div><script>const save=(k,v)=>localStorage.setItem(k,v);let dragging=false;card.addEventListener('pointerdown',()=>dragging=true);document.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.closest('#done')){done.appendChild(card);save('moved','Write the summary');setTimeout(()=>location.href='result.html',300)}});</script></body></html>
