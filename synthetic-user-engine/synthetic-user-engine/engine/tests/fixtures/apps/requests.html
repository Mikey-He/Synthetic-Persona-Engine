<!doctype html><html><head><meta charset='utf-8'><title>Requests</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>Requests</h1><div id='list'></div><button id='clear'>Clear all requests</button><script>const save=(k,v)=>localStorage.setItem(k,v);const items=JSON.parse(localStorage.getItem('requests')||'[]');list.innerHTML=items.map((t,i)=>'<p>'+t+' <button data-i="'+i+'">Approve '+t+'</button></p>').join('')||'<p>No requests</p>';list.onclick=e=>{const b=e.target.closest('button');if(!b)return;save('approved',items[b.dataset.i]);location.href='result.html'};clear.onclick=()=>{localStorage.removeItem('requests');localStorage.removeItem('approved');location.reload()};</script></body></html>
