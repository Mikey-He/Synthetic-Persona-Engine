<!doctype html><html><head><meta charset='utf-8'><title>New request</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>New request</h1><label for='t'>Title</label><input id='t'><button id='mk'>Create request</button><script>const save=(k,v)=>localStorage.setItem(k,v);mk.onclick=()=>{const items=JSON.parse(localStorage.getItem('requests')||'[]');items.push(t.value);save('requests',JSON.stringify(items));location.href='requests.html'};</script></body></html>
