<!doctype html><html><head><meta charset='utf-8'><title>Expenses</title><style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#202124}button,select,input{font:inherit;padding:6px 10px;margin:4px}</style></head><body><h1>Expenses</h1><label id='up' for='f' style='display:inline-block;padding:8px;border:1px solid #888;cursor:pointer' role='button'>Upload receipt</label><input id='f' type='file' accept='.pdf' style='display:none'><p id='name'></p><button id='sub'>Submit expense</button><script>const save=(k,v)=>localStorage.setItem(k,v);f.onchange=()=>{name.textContent='Attached: '+f.files[0].name};sub.onclick=()=>{save('receipt',f.files[0]?f.files[0].name:'none');location.href='result.html'};</script></body></html>
