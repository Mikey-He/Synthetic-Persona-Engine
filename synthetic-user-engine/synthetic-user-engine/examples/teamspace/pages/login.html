<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Teamspace</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="2" width="9" height="9" rx="2.5"/><rect x="13" y="2" width="9" height="9" rx="2.5" opacity=".55"/><rect x="2" y="13" width="9" height="9" rx="2.5" opacity=".55"/><rect x="13" y="13" width="9" height="9" rx="2.5"/></svg>
      <span>Teamspace</span>
    </div>
    <h1>Sign in to your workspace</h1>
    <p class="muted">Use your Lumen Labs account.</p>
    <div class="form-banner error" id="login-error" role="alert" hidden>That email and password don't match. Try again.</div>
    <form method="post" action="/login" class="stack" id="login-form">
      <input type="hidden" name="next" id="login-next" value="">
      <div class="field">
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="helper auth-foot">Trouble signing in? Ask a workspace admin to reset your password.</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('error')) document.getElementById('login-error').hidden = false;
      if (q.get('next')) document.getElementById('login-next').value = q.get('next');
    })();
  </script>
</body>
</html>
