<div class="page-header">
  <div>
    <h1>Settings</h1>
    <p class="muted">General settings for the Lumen Labs workspace.</p>
  </div>
</div>

<section class="card form-card">
  <h2>General</h2>
  <div class="field">
    <label for="ws-name">Workspace name</label>
    <input id="ws-name" type="text" value="Lumen Labs" readonly>
    <p class="helper">Contact support to rename your workspace.</p>
  </div>
  <div class="field">
    <label for="ws-url">Workspace URL</label>
    <input id="ws-url" type="text" value="lumenlabs.teamspace.example" readonly>
  </div>
  <div class="field">
    <label for="ws-tz">Default time zone</label>
    <select id="ws-tz" disabled>
      <option>(UTC+00:00) London</option>
    </select>
  </div>
  <p class="helper">Settings can't be changed in this demo workspace.</p>
</section>
