<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&family=Roboto+Flex:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="/platform.css">
<script type="module" src="https://esm.run/@material/web/all.js"></script>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"><span class="ms fill" style="font-size:20px">diversity_3</span></span>Persona Engine</div>
  <span class="spacer"></span>
  <md-icon-button aria-label="Help" id="help-btn"><span class="ms">help</span></md-icon-button>
</header>

<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="fab-slot"><md-fab size="medium" aria-label="Who do you want to test with?" id="rail-fab"><span slot="icon" class="ms">edit</span></md-fab></div>
    <a href="#personas" data-nav="personas"><span class="pill"><span class="ms">groups</span></span>Personas</a>
    <a href="#workflow" data-nav="workflow"><span class="pill"><span class="ms">account_tree</span></span>Workflow</a>
    <a href="#run" data-nav="run"><span class="pill"><span class="ms">play_circle</span></span>Run</a>
    <a href="#results" data-nav="results"><span class="pill"><span class="ms">insights</span></span>Results</a>
  </nav>
  <main id="main"></main>
</div>

<md-dialog id="confirm-dialog">
  <div slot="headline" id="confirm-title"></div>
  <div slot="content" id="confirm-text"></div>
  <div slot="actions"><md-text-button id="confirm-no">Cancel</md-text-button><md-text-button id="confirm-yes">OK</md-text-button></div>
</md-dialog>

<md-dialog id="group-dialog">
  <div slot="headline" id="group-title">Make a group</div>
  <div slot="content" id="group-body"></div>
  <div slot="actions"><md-text-button id="group-cancel">Cancel</md-text-button><md-filled-button id="group-go">Generate</md-filled-button></div>
</md-dialog>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <md-icon-button id="sheet-close" aria-label="Close"><span class="ms">close</span></md-icon-button>
    <h2 id="sheet-title">Edit persona</h2>
    <md-icon-button id="sheet-dup" aria-label="Duplicate" title="Duplicate"><span class="ms">content_copy</span></md-icon-button>
  </div>
  <div class="sheet-body" id="sheet-body" data-editor="sheet"></div>
  <div class="sheet-foot">
    <md-text-button id="sheet-run"><span slot="icon" class="ms">play_arrow</span>Run a test</md-text-button>
    <span class="grow"></span>
    <md-outlined-button id="sheet-cancel">Cancel</md-outlined-button>
    <md-filled-button id="sheet-save" disabled>Save</md-filled-button>
  </div>
  <md-dialog id="discard-dialog">
    <div slot="headline">Discard your changes?</div>
    <div slot="content">The persona stays as it was before you opened it.</div>
    <div slot="actions"><md-text-button id="discard-keep">Keep editing</md-text-button><md-text-button id="discard-yes">Discard</md-text-button></div>
  </md-dialog>
</aside>

<div class="snack" id="snack" role="status" aria-live="polite"><span id="snack-text"></span><button id="snack-action" hidden>Undo</button></div>

<!-- The Persona Builder holds the current workflow and builds cards exactly as the questionnaire does. -->
<iframe id="builder" src="/builder" title="Persona builder" hidden></iframe>
<script src="/flow.js"></script>
<script src="/parameters.js"></script>
<script src="/platform.js"></script>
</body>
</html>
