<title>Participant Questionnaire</title>
<style>
/* Layout: one question per screen in a narrow centred column, a hairline progress bar on top.
   System UI faces, white ground, one blue accent; nothing boxed but the choices. */
:root{
  --bg:#ffffff; --fill:#f5f5f7; --fill-2:#ebebf0; --line:#e3e3e8;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#a1a1a6;
  --accent:#0071e3; --accent-fg:#ffffff; --accent-soft:rgba(0,113,227,.08);
  --ok:#248a3d; --warn:#b25000;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fill:#1c1c1e; --fill-2:#2c2c2e; --line:#2c2c2e;
    --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#6e6e73;
    --accent:#2997ff; --accent-fg:#ffffff; --accent-soft:rgba(41,151,255,.14);
    --ok:#30d158; --warn:#ff9f0a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fill:#1c1c1e; --fill-2:#2c2c2e; --line:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#6e6e73;
  --accent:#2997ff; --accent-fg:#ffffff; --accent-soft:rgba(41,151,255,.14);
  --ok:#30d158; --warn:#ff9f0a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.track{height:3px;background:var(--fill-2)}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.bar{max-width:640px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.back{border:0;background:none;color:var(--accent);font-size:15px;padding:6px 0;display:inline-flex;align-items:center;gap:4px}
.back[hidden]{display:none}
.back svg{width:14px;height:14px}
.where{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:inline-flex;gap:2px;font-size:13px}
.langs button{border:0;background:none;padding:6px 8px;border-radius:6px;color:var(--fg-3)}
.langs button[aria-pressed="true"]{color:var(--fg);font-weight:600}

main{max-width:640px;margin:0 auto;padding-inline:20px;padding-block:clamp(28px,8vh,72px) 64px}
.eyebrow{font-size:13px;color:var(--fg-2);margin:0 0 10px}
h1{font-size:clamp(26px,5vw,32px);font-weight:600;letter-spacing:-.01em;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:clamp(21px,4vw,25px);font-weight:600;letter-spacing:-.005em;line-height:1.35;margin:0;text-wrap:balance}
.sub{color:var(--fg-2);font-size:15px;margin:10px 0 0;max-width:34em}
.body{margin-top:28px;display:flex;flex-direction:column;gap:22px}
.lines{display:flex;flex-direction:column;gap:12px;color:var(--fg-2);font-size:15.5px;max-width:34em}
.lines p{margin:0}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;transition:background .15s,border-color .15s}
.choice:hover{background:var(--fill)}
.choice .mark{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--fg-3);border-radius:50%;display:grid;place-items:center;transition:border-color .15s,background .15s}
.choice.box .mark{border-radius:6px}
.choice .mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent-fg);transform:scale(0);transition:transform .15s}
.choice.box .mark::after{width:10px;height:6px;border-radius:0;background:none;border-left:2px solid var(--accent-fg);border-bottom:2px solid var(--accent-fg);transform:rotate(-45deg) scale(0);margin-top:-2px}
.choice .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice .t{font-size:16px}
.choice .d{font-size:13.5px;color:var(--fg-2)}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-checked="true"] .mark{border-color:var(--accent);background:var(--accent)}
.choice[aria-checked="true"] .mark::after{transform:scale(1)}
.choice.box[aria-checked="true"] .mark::after{transform:rotate(-45deg) scale(1)}

.field{display:flex;flex-direction:column;gap:8px}
.field span{font-size:13.5px;color:var(--fg-2)}
.input{width:100%;min-width:0;border:1px solid transparent;background:var(--fill);border-radius:12px;padding:13px 14px;font-size:16px;transition:border-color .15s,background .15s}
.input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
textarea.input{min-height:132px;resize:vertical;line-height:1.55}
.input::placeholder{color:var(--fg-3)}

.task{margin:0;padding:18px 20px;background:var(--fill);border-radius:14px;font-size:15.5px;line-height:1.6;white-space:pre-line}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:6px}
.btn{border:0;border-radius:980px;padding:12px 24px;font-size:16px;font-weight:500;background:var(--fill);color:var(--fg);min-height:46px;transition:opacity .15s,background .15s}
.btn:hover{background:var(--fill-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{opacity:.9;background:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.link{border:0;background:none;color:var(--accent);font-size:15px;padding:8px 2px}
.hint{font-size:13px;color:var(--fg-3)}
@media (max-width:520px){.actions .btn{flex:1}}

.word{font-size:clamp(40px,10vw,56px);font-weight:600;letter-spacing:-.01em;text-align:center;margin:12px 0 4px}
.count{text-align:center;font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.pair .choice{justify-content:center;padding:18px 12px}
.pair .choice .mark{display:none}
.pair .choice .t{font-weight:500}

.status{font-size:14px;color:var(--fg-2)}
.status.ok{color:var(--ok)}
.status.warn{color:var(--warn)}
details{border-top:1px solid var(--line);padding-top:14px}
details summary{cursor:pointer;color:var(--fg-2);font-size:14px}
details textarea{margin-top:12px;font-family:var(--f-mono);font-size:12.5px;min-height:160px}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.todo li{border-bottom:1px solid var(--line)}
.todo button{width:100%;display:flex;justify-content:space-between;gap:12px;border:0;background:none;padding:13px 2px;text-align:left;font-size:15px}
.todo button span:last-child{color:var(--accent);flex:none}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div class="track"><i id="track"></i></div>
  <div class="bar">
    <button type="button" class="back" id="back" data-act="back"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9.5 2 4.5 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="back-t"></span></button>
    <span class="where" id="where"></span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="lang-zh" data-lang="zh">中文</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
</div>
<main id="main"></main>

var PART={you:T("关于你","About you"),exp:T("你的经历","Your experience"),lang:T("语言","Language"),vocab:T("英文词汇","English words"),habits:T("做事习惯","How you work"),senses:T("看和点","Seeing and clicking"),task:T("这次的任务","The task"),end:T("完成","Done")};
function screens(){
  var s=[{id:"intro",part:"you"},{id:"name",part:"you"}];
  SOURCES.forEach(function(src){
    s.push({id:"bg-"+src.k,part:"exp",src:src});
    s.push({id:"screen-"+src.k,part:"exp",src:src});
    shownExps(src.k).forEach(function(e){s.push({id:"exp-"+e.id,part:"exp",src:src,e:e});});
  });
  s.push({id:"ui",part:"lang"},{id:"english",part:"lang"},{id:"vintro",part:"vocab"});
  VOCAB.forEach(function(w,i){s.push({id:"v-"+w,part:"vocab",w:w,i:i});});
  s.push({id:"story",part:"habits"});
  HABITS.forEach(function(h){s.push({id:"t-"+h.id,part:"habits",h:h});if(h.id==="R1")s.push({id:"follow",part:"habits"});});
  SENSES.forEach(function(q){s.push({id:"p-"+q.id,part:"senses",q:q});});
  s.push({id:"task",part:"task"},{id:"care",part:"task"},{id:"done",part:"task"});
  if(asksMiss()){s.push({id:"miss",part:"task"});if(A.doneMiss===3)s.push({id:"missother",part:"task"});}
  s.push({id:"finish",part:"end"});
  return s;
}
/* Whether a screen still needs an answer (text screens are optional unless listed). */
function answered(sc){
  var id=sc.id;
  if(id==="name")return !!A.name.trim();
  if(id.indexOf("screen-")===0)return !!(A.screen[sc.src.k]||[]).length;
  if(sc.e)return A.answers[sc.e.id]!=null;
  if(id==="ui")return !!A.lang.ui;
  if(id==="english")return !!A.lang.english;
  if(sc.w)return A.vocab[sc.w]!=null;
  if(sc.h)return A.tend[sc.h.id]!=null;
  if(sc.q)return A.perc[sc.q.id]!=null;
  if(id==="care")return !!A.careText.trim();
  if(id==="done")return A.done.length>0;
  if(id==="miss")return A.doneMiss!=null;
  return true;
}

function render(focusFirst){
  var list=screens(), i=index(list), sc=list[i];
  ui.at=sc.id;
  document.documentElement.lang=ui.lang==="zh"?"zh":"en";
  $("lang-zh").setAttribute("aria-pressed",String(ui.lang==="zh"));$("lang-en").setAttribute("aria-pressed",String(ui.lang==="en"));
  $("back").hidden=i===0;$("back-t").textContent=L(T("上一题","Back"));
  $("where").textContent=sc.id==="intro"?"":L(PART[sc.part]);
  $("track").style.width=Math.round(i/(list.length-1)*100)+"%";
  var m=$("main");m.innerHTML='<div'+(sc.id!==shownId?' class="fade"':'')+'>'+screenHtml(sc)+'</div>';shownId=sc.id;
  // Text screens put the cursor in the box on a computer; phones keep the keyboard closed.
  if(focusFirst&&/^(name|bg-|story|follow|care|missother)/.test(sc.id)&&window.matchMedia("(pointer:fine)").matches){var f=m.querySelector("input,textarea");if(f)f.focus();}

function go(id){ui.at=id;ui.msg="";ui.confirmReset=false;save();render(true);window.scrollTo(0,0);}
function step(d){var list=screens(),i=index(list),j=Math.max(0,Math.min(list.length-1,i+d));go(list[j].id);}
function soon(){clearTimeout(advancing);advancing=setTimeout(function(){step(1);},220);}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act],[data-lang]");if(!b||b.disabled)return;
  if(b.hasAttribute("data-lang")){ui.lang=b.getAttribute("data-lang");save();render();return;}
  var act=b.getAttribute("data-act"),v=b.getAttribute("data-v");
  if(act!=="reset")ui.confirmReset=false;
  switch(act){
    case "next":step(1);return;
    case "back":clearTimeout(advancing);step(-1);return;
    case "go":go(v);return;
    case "screen":
      var k=b.getAttribute("data-k"),sel=(A.screen[k]||[]).slice(),at=sel.indexOf(v);
      if(v==="__none")sel=at>=0?[]:["__none"];
      else{sel=sel.filter(function(x){return x!=="__none";});at=sel.indexOf(v);if(at>=0)sel.splice(at,1);else sel.push(v);}
      A.screen[k]=sel;save();render();return;
    case "done":var d=A.done.slice(),di=d.indexOf(v);if(di>=0)d.splice(di,1);else d.push(v);A.done=d;if(!asksMiss()){A.doneMiss=null;A.doneMissOther="";}save();render();return;
    case "exp":A.answers[b.getAttribute("data-id")]=parseInt(v,10);break;
    case "lang":A.lang[b.getAttribute("data-k")]=v;break;
    case "tend":A.tend[b.getAttribute("data-id")]=parseInt(v,10);break;
    case "perc":A.perc[b.getAttribute("data-id")]=parseInt(v,10);break;
    case "miss":A.doneMiss=parseInt(v,10);if(A.doneMiss!==3)A.doneMissOther="";break;
    case "vocab":A.vocab[screens()[index(screens())].w]=parseInt(v,10);break;
    case "savefile":saveFile();return;
    case "copy":copyOut();return;
    case "reset":
      if(!ui.confirmReset){ui.confirmReset=true;render();return;}
      try{localStorage.removeItem(KEY);}catch(e){}
      location.reload();return;
    default:return;
  }
  save();render();
  if(!/^exp-/.test(ui.at))soon(); // a single choice moves on by itself; experience questions wait, there is a note box
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.hasAttribute("data-f"))A[t.getAttribute("data-f")]=t.value;
  else if(t.hasAttribute("data-bg"))A.background[t.getAttribute("data-bg")]=t.value;
  else if(t.hasAttribute("data-other"))A.screenOther[t.getAttribute("data-other")]=t.value;
  else if(t.hasAttribute("data-note"))A.expNotes[t.getAttribute("data-note")]=t.value;
  else return;
  save();
  var btn=document.querySelector('.btn.primary[data-act="next"]');if(btn){var list=screens();btn.disabled=!answered(list[index(list)]);}
});
document.addEventListener("keydown",function(ev){
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var t=ev.target,typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA");
  if(ev.key==="Enter"&&!typing){var n=document.querySelector('.btn.primary[data-act="next"]:not(:disabled)');if(n){ev.preventDefault();n.click();}return;}
  if(ev.key==="Enter"&&t&&t.tagName==="INPUT"){var n2=document.querySelector('.btn.primary[data-act="next"]:not(:disabled)');if(n2){ev.preventDefault();n2.click();}return;}
  if(typing)return;
  if(/^[1-9]$/.test(ev.key)){var opts=document.querySelectorAll("#main .choice"),o=opts[parseInt(ev.key,10)-1];if(o){ev.preventDefault();o.click();}}
  else if(ev.key==="ArrowLeft"&&!$("back").hidden){ev.preventDefault();step(-1);}
});

/* ---------- handing the answers over ---------- */
function say(msg,cls){ui.msg=msg;ui.msgCls=cls||"";render();}
function saveFile(){
  var data=exportText();
  if(inViewer&&!downloads){downloads=false;say(L(T("这里保存不了文件，请点「复制答案」。","Files can't be saved here. Please use Copy answers.")),"warn");return;}
  if(downloads){
    downloads.save({filename:fileName(),data:data}).then(function(){say(L(T("文件已经保存，把它发给研究人员就行。","Saved. Send the file to the researcher.")),"ok");},function(err){
      var c=err&&err.code;
      if(c==="declined")return;
      if(c==="rate_limited"){say(L(T("保存的提示已经打开了，先处理那一个。","A save prompt is already open; finish that one first.")),"warn");return;}
      downloads=false;say(L(T("这里保存不了文件，请点「复制答案」。","Files can't be saved here. Please use Copy answers.")),"warn");
    });
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");
    a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2000);
    say(L(T("文件已经下载，把它发给研究人员就行。","Downloaded. Send the file to the researcher.")),"ok");
  }catch(e){say(L(T("这里保存不了文件，请点「复制答案」。","Files can't be saved here. Please use Copy answers.")),"warn");}
}
function copyOut(){
  var data=exportText(),fail=function(){say(L(T("没能自动复制。展开下面的答案，全选后复制。","Couldn't copy automatically. Open the answers below, select all and copy.")),"warn");var d=document.querySelector("details");if(d){d.open=true;var o=$("f-out");if(o){o.focus();o.select();}}};
  try{navigator.clipboard.writeText(data).then(function(){say(L(T("已复制，粘贴到邮件或消息里发给研究人员。","Copied. Paste it into an email or message to the researcher.")),"ok");},fail);}catch(e){fail();}
}

/* ---------- boot ---------- */
load();
if(!ui.lang)ui.lang="en"; // English first; 中文 stays one tap away
render();
if(inViewer){
  window.claude.use("downloads").then(function(d){downloads=d||false;if(ui.at==="finish")render();},function(){downloads=false;});
}
})();
</script>
